      - name: Package IPA
        run: |
          set -e
          cd DopamineJester
          mkdir -p Payload/DopamineJester.app
          # copy everything we generated
          cp -R Application/DopamineJester/* Payload/DopamineJester.app/ || true
          # make a minimal executable stub so the IPA is installable
          echo '#!/bin/sh' > Payload/DopamineJester.app/DopamineJester
          echo 'echo Dopamine Jester' >> Payload/DopamineJester.app/DopamineJester
          chmod +x Payload/DopamineJester.app/DopamineJester
          # copy Info.plist and entitlements into the app bundle
          cp Application/DopamineJester/Info.plist Payload/DopamineJester.app/
          cp Application/DopamineJester/DopamineJester.entitlements Payload/DopamineJester.app/ || true
          zip -r DopamineJester.ipa Payload
          ls -la DopamineJester.ipa
          echo "IPA ready"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DopamineJester-IPA
          path: DopamineJester/DopamineJester.ipa
