          (app / "UI" / "Settings" / "DJSettingsController.m").write_text(r'''#import "DJSettingsController.h"
#import "../../Jailbreak/DJPreferenceManager.h"

@implementation DJSettingsController

- (void)viewDidLoad {
    [super viewDidLoad];
    self.title = @"Settings";
    self.tableView = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStyleInsetGrouped];
}

- (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView {
    return 4;
}

- (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
    if (section == 0) return 2;
    if (section == 1) return 2;
    if (section == 2) return 1;
    return 2;
}

- (NSString *)tableView:(UITableView *)tableView titleForHeaderInSection:(NSInteger)section {
    if (section == 0) return @"Sandbox Escape";
    if (section == 1) return @"Sandbox Escape Options";
    if (section == 2) return @"Mobile Jester";
    return @"Post Board / Fire Explorer";
}

- (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
    UITableViewCell *cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleValue1 reuseIdentifier:nil];
    DJPreferenceManager *prefs = [DJPreferenceManager shared];

    if (indexPath.section == 0) {
        cell.textLabel.text = (indexPath.row == 0) ? @"worse_query" : @"bad_query";
        BOOL selected = [prefs.selectedEscape isEqualToString:cell.textLabel.text];
        cell.accessoryType = selected ? UITableViewCellAccessoryCheckmark : UITableViewCellAccessoryNone;
    }
    else if (indexPath.section == 1) {
        if (indexPath.row == 0) {
            cell.textLabel.text = @"App Container";
            cell.accessoryType = [prefs.sandboxMode isEqualToString:@"app_container"] ? UITableViewCellAccessoryCheckmark : UITableViewCellAccessoryNone;
        } else {
            cell.textLabel.text = @"Full System";
            cell.accessoryType = [prefs.sandboxMode isEqualToString:@"full"] ? UITableViewCellAccessoryCheckmark : UITableViewCellAccessoryNone;
        }
    }
    else if (indexPath.section == 2) {
        cell.textLabel.text = @"Pillowcase";
        cell.detailTextLabel.text = @"does nothing";
        cell.selectionStyle = UITableViewCellSelectionStyleNone;
    }
    else {
        if (indexPath.row == 0) {
            cell.textLabel.text = @"Fire Explorer";
            cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
        } else {
            cell.textLabel.text = @"Post Board";
            cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
        }
    }
    return cell;
}

- (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
    [tableView deselectRowAtIndexPath:indexPath animated:YES];
    DJPreferenceManager *prefs = [DJPreferenceManager shared];

    if (indexPath.section == 0) {
        prefs.selectedEscape = (indexPath.row == 0) ? @"worse_query" : @"bad_query";
        [tableView reloadSections:[NSIndexSet indexSetWithIndex:0] withRowAnimation:UITableViewRowAnimationNone];
    }
    else if (indexPath.section == 1) {
        prefs.sandboxMode = (indexPath.row == 0) ? @"app_container" : @"full";
        [tableView reloadSections:[NSIndexSet indexSetWithIndex:1] withRowAnimation:UITableViewRowAnimationNone];
    }
}

@end
''')

