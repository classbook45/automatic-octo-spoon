          (app / "Jailbreak" / "DJPreferenceManager.m").write_text('''#import "DJPreferenceManager.h"

@implementation DJPreferenceManager

+ (instancetype)shared {
    static DJPreferenceManager *instance = nil;
    static dispatch_once_t onceToken;
    dispatch_once(&onceToken, ^{
        instance = [[DJPreferenceManager alloc] init];
    });
    return instance;
}

- (NSString *)selectedEscape {
    NSString *v = [[NSUserDefaults standardUserDefaults] stringForKey:@"selectedEscape"];
    return v ?: @"worse_query";
}

- (void)setSelectedEscape:(NSString *)value {
    [[NSUserDefaults standardUserDefaults] setObject:value forKey:@"selectedEscape"];
    [[NSUserDefaults standardUserDefaults] synchronize];
}

- (NSString *)sandboxMode {
    NSString *v = [[NSUserDefaults standardUserDefaults] stringForKey:@"sandboxMode"];
    return v ?: @"full";
}

- (void)setSandboxMode:(NSString *)value {
    [[NSUserDefaults standardUserDefaults] setObject:value forKey:@"sandboxMode"];
    [[NSUserDefaults standardUserDefaults] synchronize];
}

- (NSString *)targetPath {
    NSString *v = [[NSUserDefaults standardUserDefaults] stringForKey:@"targetPath"];
    return v ?: @"/var/mobile/Containers/Data/Application";
}

- (void)setTargetPath:(NSString *)value {
    [[NSUserDefaults standardUserDefaults] setObject:value forKey:@"targetPath"];
    [[NSUserDefaults standardUserDefaults] synchronize];
}

@end
''')

