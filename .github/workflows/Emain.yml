name: Build Dopamine Jester IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Generate complete project
        run: |
          python3 << 'PY'
          import os, pathlib, textwrap

          root = pathlib.Path("DopamineJester")
          app = root / "Application" / "DopamineJester"
          (app / "UI" / "Settings").mkdir(parents=True, exist_ok=True)
          (app / "Jailbreak").mkdir(parents=True, exist_ok=True)
          (app / "Exploits").mkdir(parents=True, exist_ok=True)
          (app / "Resources").mkdir(parents=True, exist_ok=True)

          # ========== ENTITLEMENTS (App Group) ==========
          (app / "DopamineJester.entitlements").write_text('''<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>com.apple.security.application-groups</key>
	<array>
		<string>group.com.sussy.dopaminejester</string>
	</array>
</dict>
</plist>
''')

