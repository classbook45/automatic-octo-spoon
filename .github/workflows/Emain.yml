#import "Settings/DJSettingsController.h"
#import "../Jailbreak/DJJailbreaker.h"

@interface DJMainViewController ()
@property (nonatomic, strong) UITextView *logView;
@property (nonatomic, strong) UIButton *applyBtn;
@end

@implementation DJMainViewController

- (void)viewDidLoad {
    [super viewDidLoad];
    self.view.backgroundColor = [UIColor systemBackgroundColor];
    self.title = @"Dopamine Jester";

    self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithTitle:@"Settings" style:UIBarButtonItemStylePlain target:self action:@selector(openSettings)];

    self.logView = [[UITextView alloc] init];
    self.logView.editable = NO;
    self.logView.font = [UIFont monospacedSystemFontOfSize:12 weight:UIFontWeightRegular];
    self.logView.backgroundColor = [UIColor secondarySystemBackgroundColor];
    self.logView.layer.cornerRadius = 10;
    self.logView.text = @"Ready.\nPick options in Settings, then hit Apply.\n";
    self.logView.translatesAutoresizingMaskIntoConstraints = NO;
    [self.view addSubview:self.logView];

    self.applyBtn = [UIButton buttonWithType:UIButtonTypeSystem];
    [self.applyBtn setTitle:@"Apply" forState:UIControlStateNormal];
    self.applyBtn.titleLabel.font = [UIFont systemFontOfSize:18 weight:UIFontWeightSemibold];
    self.applyBtn.backgroundColor = [UIColor systemPurpleColor];
    [self.applyBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
    self.applyBtn.layer.cornerRadius = 14;
    self.applyBtn.translatesAutoresizingMaskIntoConstraints = NO;
    [self.applyBtn addTarget:self action:@selector(startApply) forControlEvents:UIControlEventTouchUpInside];
    [self.view addSubview:self.applyBtn];

    [NSLayoutConstraint activateConstraints:@[
        [self.logView.topAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.topAnchor constant:20],
        [self.logView.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:16],
        [self.logView.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-16],
        [self.logView.bottomAnchor constraintEqualToAnchor:self.applyBtn.topAnchor constant:-20],
        [self.applyBtn.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor constant:16],
        [self.applyBtn.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor constant:-16],
        [self.applyBtn.bottomAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.bottomAnchor constant:-20],
        [self.applyBtn.heightAnchor constraintEqualToConstant:54]
    ]];
}

- (void)openSettings {
    [self.navigationController pushViewController:[[DJSettingsController alloc] init] animated:YES];
}

- (void)appendLog:(NSString *)line {
    self.logView.text = [self.logView.text stringByAppendingFormat:@"%@\n", line];
    [self.logView scrollRangeToVisible:NSMakeRange(self.logView.text.length - 1, 1)];
}

- (void)startApply {
    self.applyBtn.enabled = NO;
    [self appendLog:@"=== starting ==="];
    DJJailbreaker *jb = [DJJailbreaker new];
    [jb runWithLog:^(NSString *msg) {
        dispatch_async(dispatch_get_main_queue(), ^{
            [self appendLog:msg];
        });
    } completion:^(BOOL success, NSString *msg) {
        [self appendLog:success ? @"[+] success" : [@"[-] " stringByAppendingString:msg]];
        self.applyBtn.enabled = YES;
    }];
}

@end
''')

