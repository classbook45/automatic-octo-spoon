          (app / "Jailbreak" / "DJJailbreaker.m").write_text(r'''#import "DJJailbreaker.h"
#import "DJPreferenceManager.h"
#import "../Exploits/worse_query.h"
#import "../Exploits/bad_query.h"

@implementation DJJailbreaker

- (void)runWithLog:(void(^)(NSString *))log completion:(void(^)(BOOL, NSString *))completion {
    dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
        DJPreferenceManager *prefs = [DJPreferenceManager shared];
        NSString *escape = prefs.selectedEscape;
        NSString *mode = prefs.sandboxMode;
        NSString *target = prefs.targetPath;
        NSString *group = @"group.com.sussy.dopaminejester";

        log([NSString stringWithFormat:@"[*] selected escape: %@", escape]);
        log([NSString stringWithFormat:@"[*] sandbox mode: %@", mode]);
        log([NSString stringWithFormat:@"[*] target: %@", target]);

        int64_t handle = -1;

        if ([escape isEqualToString:@"worse_query"]) {
            bool alt = [mode isEqualToString:@"app_container"];
            log(@"[*] calling worse_query...");
            handle = worse_query(target, group, alt, NO);
        } else {
            bool is_group = [mode isEqualToString:@"app_container"];
            log(@"[*] calling bad_query...");
            handle = bad_query((char *)target.UTF8String, false, (char *)group.UTF8String, is_group);
        }

        if (handle < 0) {
            NSString *err = [NSString stringWithFormat:@"escape failed with code %lld", handle];
            log([@"[-] " stringByAppendingString:err]);
            dispatch_async(dispatch_get_main_queue(), ^{ completion(NO, err); });
            return;
        }

        log([NSString stringWithFormat:@"[+] sandbox extension handle: %lld", handle]);
        log(@"[+] escape successful — applying selected options...");

        // pillowcase intentionally does nothing
        log(@"[*] pillowcase: no-op");

        // release when done
        if ([escape isEqualToString:@"worse_query"]) {
            worse_query_release(handle);
        } else {
            bad_query_release(handle);
        }

        log(@"[+] done");
        dispatch_async(dispatch_get_main_queue(), ^{
            completion(YES, @"Applied successfully");
        });
    });
}

@end
''')

