name: Build PAY-LAUNCH PS4 PKG

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install icon and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-dejavu-core
      - name: Generate app icon and stage font
        run: |
          mkdir -p sce_sys assets
          python3 tools/make_icon.py
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf assets/DejaVuSans.ttf
      - name: Build with official OpenOrbis container
        run: |
          docker run --rm -w /workspace -v "$PWD:/workspace" openorbisofficial/toolchain:latest make
      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: PAY-LAUNCH-PS4-PKG
          path: |
            *.pkg
            eboot.bin
          if-no-files-found: error
          retention-days: 30
