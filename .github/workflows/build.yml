name: Build PAY-LAUNCH PS4 PKG

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pay-launch-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TITLE: PAY-LAUNCH
      TITLE_ID: PAYL00001
      VERSION: "01.00"
      CONTENT_ID: IV0000-PAYL00001_00-PAYLAUNCHAPP0001
      TOOLCHAIN: openorbisofficial/toolchain:v0.5.1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install asset-generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pil fonts-dejavu-core file

      - name: Generate app assets
        run: |
          set -euo pipefail
          mkdir -p sce_sys assets build-artifacts
          python3 tools/make_icon.py
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf assets/DejaVuSans.ttf
          test -s sce_sys/icon0.png
          test -s assets/DejaVuSans.ttf
          file sce_sys/icon0.png assets/DejaVuSans.ttf

      - name: Download OpenOrbis toolchain
        run: docker pull "$TOOLCHAIN"

      - name: Compile and create PS4 package
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TOOLCHAIN" \
            bash -euc 'set -o pipefail; make clean all 2>&1 | tee build.log'

      - name: Verify generated package
        run: |
          set -euo pipefail
          PACKAGE="$CONTENT_ID.pkg"
          test -s "$PACKAGE"
          test -s eboot.bin
          file "$PACKAGE" eboot.bin
          echo "Package size: $(stat -c%s "$PACKAGE") bytes"
          sha256sum "$PACKAGE" | tee build-artifacts/SHA256SUMS
          cp "$PACKAGE" build-artifacts/PAY-LAUNCH-PS4.pkg
          cp eboot.bin build-artifacts/eboot.bin

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: PAY-LAUNCH-PS4-PKG
          path: |
            build-artifacts/PAY-LAUNCH-PS4.pkg
            build-artifacts/eboot.bin
            build-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PAY-LAUNCH-BUILD-LOG
          path: build.log
          if-no-files-found: warn
          retention-days: 14
